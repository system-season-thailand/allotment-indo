<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allotment INDONESIA</title>
    <link rel="stylesheet" href="allotment.css">
</head>

<body>



    <!-- Top Controls -->
    <div class="top-controls">
        <button id="toggleModeBtn" class="mode-toggle">Mood</button>
        <select id="userSelector" class="user-selector"></select>
    </div>


    <!-- Modal -->
    <div id="roleModal" class="modal">
        <div class="modal-content">
            <h3>Mood</h3>
            <div>
                <button id="viewModeBtn">View</button>
                <button id="editorModeBtn">Editor</button>
            </div>
            <input type="password" id="editorPassword" placeholder="Enter password for Editor">
        </div>
    </div>





    <h2>Allotment <span style="color: red;">INDONESIA</span></h2>
    <div id="hotelSelectorContainer"></div>



    <!-- Year Tabs -->
    <div id="yearTabs" class="tabs" style="margin-bottom: 10px;"></div>



    <div id="monthTabs" class="tabs"></div>

    <div class="content-area">
        <h3 id="currentHotelNameTitle" class="hotel-name-title"></h3>
        <div class="season-trigger-wrap">
            <button id="seasonMoreBtn" class="season-more-btn" style="display:none;" onclick="openSeasonModal()">
                More Details
            </button>
        </div>
        <h3 id="currentMonthYearTitle" class="month-title"></h3>
        <div id="tableContainer" style="overflow-x: auto;"></div>
    </div>

    <!-- Reference Table for Color Meanings -->
    <div class="reference-table">
        <div class="reference-grid">
            <div class="reference-item">
                <div class="reference-color available"></div>
                <span>Available</span>
            </div>
            <div class="reference-item">
                <div class="reference-color closed"></div>
                <span>Close Sell</span>
            </div>
            <div class="reference-item">
                <div class="reference-color released"></div>
                <span>Allotment Not Available</span>
            </div>
            <div class="reference-item">
                <div class="reference-color booked"></div>
                <span>Booked By Us</span>
            </div>
        </div>
    </div>





    <!-- Season Details Modal -->
    <div id="seasonModal" class="season-modal-overlay" onclick="handleSeasonModalBackdrop(event)">
        <div class="season-modal-box">
            <button class="season-modal-close" onclick="closeSeasonModal()">&times;</button>
            <div class="season-modal-header">
                <div id="seasonModalHotelName" class="season-modal-hotel"></div>
                <div id="seasonModalMonthLabel" class="season-modal-month"></div>
            </div>
            <div id="seasonModalBody" class="season-modal-body"></div>
        </div>
    </div>

    <!-- Notification System -->
    <div id="notificationContainer" class="notification-container">
        <div class="notification-box">
            <div class="notification-content">
                <span id="notificationMessage"></span>
            </div>
        </div>
    </div>



    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase Import Databse Project -->
    <script>
        // Wait for Supabase library to load and initialize client
        (function () {
            const supabaseUrl = 'https://zrunsrimyijarswjfycw.supabase.co';
            const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpydW5zcmlteWlqYXJzd2pmeWN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY3MjgzOTEsImV4cCI6MjA2MjMwNDM5MX0.UdW4LiIY-t1jZlrat1VUGnW0yRE7YEzW5SHbpkE29H8'; // truncated for safety

            function initSupabase() {
                // The CDN exposes supabase library - access it from window
                if (window.supabase && typeof window.supabase.createClient === 'function') {
                    // Create client and store it
                    const client = window.supabase.createClient(supabaseUrl, supabaseKey);

                    // Store client on window for backup access
                    window.supabaseClient = client;

                    // Replace window.supabase with the client (the library is no longer needed)
                    // This makes 'supabase' available globally as the client
                    window.supabase = client;
                } else {
                    // Retry if library not loaded yet
                    setTimeout(initSupabase, 50);
                }
            }

            // Start initialization
            initSupabase();
        })();
    </script>






    <script src="all-allotment-hotel-names.js"></script>
    <script src="user-selector.js"></script>
    <script src="allotment.js"></script>

</body>

</html>
